name: Publish PG sandbox kit to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - pg-kit/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx CLI
        run: curl -fsSL https://get.docker.com/sbx | sh

      - name: Install oras
        run: |
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz | tar -xz oras
          sudo mv oras /usr/local/bin/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sharanshirodkar07
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate kit
        run: sbx kit validate ./pg-kit

      - name: Push kit to Docker Hub
        run: sbx kit push ./pg-kit docker.io/predictionguard/sbx-predictionguard:latest --sign
