name: Publish PG sandbox kit to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - pg-kit/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sharanshirodkar07
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push kit image
        uses: docker/build-push-action@v6
        with:
          context: ./pg-kit
          file: ./pg-kit/predictionguard.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/predictionguard/sbx-predictionguard:latest

      - name: Update Docker Hub README
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
          SHORT_DESCRIPTION: "Docker Sandbox kit for Prediction Guard: operational control of every action your AI agents take."
        run: |
          token=$(curl -s -X POST https://hub.docker.com/v2/auth/token \
            -H "Content-Type: application/json" \
            -d "{\"identifier\":\"sharanshirodkar07\",\"secret\":\"$DOCKERHUB_PAT\"}" \
            | jq -r .access_token)
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            https://hub.docker.com/v2/repositories/predictionguard/sbx-predictionguard/ \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --rawfile full pg-kit/README.md --arg short "$SHORT_DESCRIPTION" '{description: $short, full_description: $full}')")
          echo "$response"
          echo "$response" | grep -q "HTTP_STATUS:20" && echo "Docker Hub README updated" || echo "Failed to update README"
