name: Publish PG sandbox kit to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - pg-kit/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # get.docker.com/sbx 403s on CI runners; install the latest published .deb instead
          gh release download \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Install oras
        run: |
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz | tar -xz oras
          sudo mv oras /usr/local/bin/

      - name: Log in to Docker Hub (sbx credential store)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | sbx login --username sharanshirodkar07 --password-stdin

      - name: Validate kit
        run: sbx kit validate ./pg-kit

      - name: Push kit to Docker Hub
        run: sbx kit push ./pg-kit docker.io/predictionguard/sbx-predictionguard:latest
