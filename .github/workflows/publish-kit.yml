name: Publish PG sandbox kit to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - pg-kit/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sharanshirodkar07
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push kit image
        uses: docker/build-push-action@v6
        with:
          context: ./pg-kit
          file: ./pg-kit/predictionguard.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/predictionguard/sbx-predictionguard:latest

      - name: Update Docker Hub README
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          token=$(curl -s -X POST https://hub.docker.com/v2/users/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"sharanshirodkar07\",\"password\":\"$DOCKERHUB_PAT\"}" \
            | jq -r .token)
          curl -s -f -X PATCH https://hub.docker.com/v2/repositories/predictionguard/sbx-predictionguard/ \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": $(jq -Rs . < pg-kit/README.md)}" \
            && echo "Docker Hub README updated" || echo "Failed to update README"
